<html>
<head>
    <title>layout practice</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        header {
            width: 100%;
            height: 60px;
            font-size: 40px;
            font-weight: bold;
            color: purple;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 20px;
        }

        main {
            width: 70%;
        }

        main h1 {
            font-size: 60px;
            margin-bottom: 10px;
        }

        main p {
            font-size: 30px;
        }

        aside {
            width: 25%;
            min-height: 250px;
            background-color: #e9e9e9;
            padding: 20px;
        }

        aside h2 {
            margin-top: 0;
            font-size: 24px;
        }

        footer {
            margin-top: 40px;
            border-top: 1px solid #999;
            text-align: center;
            padding: 30px 0;
            font-size: 24px;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#">홈</a>
        </nav>
    </header>

    <div class="container"> 
        <!-- main { display: flex; }로도 가능 -->
        <main>
            <h1>기사 제목</h1>
            <p>내용이 들어가는 곳입니다.</p>
        </main>

        <aside>
            <h2>관련 정보</h2>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 회사명</p>
    </footer>
</body>
</html>
